    <section class="py-4" style="background-image: url(./images/bg_paper.png);">
        <h4 class="text-center text-info mb-3">HAPPY CAT</h4>
        <h2 class="text-center mb-4 fw-bold">開始輕鬆養貓</h2>
    </section>

    <section class="py-5 container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <form action="" class="p-lg-5 shadow-lg">
                    <h3 class="deco-line mb-3">選擇方案</h3>
                    <div class="row row-cols-1 row-cols-lg-3 g-3 mb-5">
                        <div class="col">
                            <button type="button"class="btn btn-outline-info w-100 py-3 text-dark h-100 fw-bold">
                                體驗探索方案<br class="d-none d-lg-block">
                                NT 298/月
                            </button>
                        </div>
                        <div class="col">
                            <button type="button"class="btn btn-outline-info w-100 py-3 text-dark h-100 fw-bold">
                                全自動大滿足方案<br class="d-none d-lg-block">
                                NT 666/月
                            </button>
                        </div>
                        <div class="col">
                            <button type="button"class="btn btn-outline-info w-100 py-3 btn-special active h-100 fw-bold">
                                尊榮多貓客製化方案<br class="d-none d-lg-block">
                                客製化詢價
                            </button>
                        </div>
                    </div>
                    <h3 class="deco-line mb-3">填寫資料</h3>
                    <div class="row g-4">
                        <div class="col-lg-6">
                            <label for="firstName" class="form-label">名字</label>
                            <input type="text" class="form-control" id="firstName">
                        </div>
                        <div class="col-lg-6">
                            <label for="lastName" class="form-label">姓氏</label>
                            <input type="text" class="form-control" id="lastName">
                        </div>
                        <div class="col-12">
                            <label for="phoneNumber" class="form-label">手機號碼</label>
                            <input type="tel" class="form-control" id="phoneNumber">
                        </div>
                        <div class="col-12">
                            <label for="emailAddress" class="form-label">電子郵件</label>
                            <input type="email" class="form-control" id="emailAddress">
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label">住址</label>
                            <input type="text" class="form-control" id="address">
                        </div>
                        <div class="col-12">
                            <label for="contactTime" class="form-label">方便聯繫時間</label>
                            <select id="contactTime" class="form-select">
                                <option selected>13:00-17:00</option>
                                <option value="1">18:00-22:00</option>
                                <option value="2">不指定</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <p class="mb-0">加購服務</p>
                            <div class="from-check my-2">
                                <input class="form-check-input" type="checkbox" id="gridCheck01">
                                <label class="form-check-label" for="gridCheck01">
                                    專利除臭抑菌濾芯定期配送 +$100 / 月
                                </label>
                            </div>
                            <div class="from-check my-2">
                                <input class="form-check-input" type="checkbox" id="gridCheck02">
                                <label class="form-check-label" for="gridCheck02">
                                    智能極致靜音模式升級 +$50 / 月
                                </label>
                            </div>
                            <div class="from-check my-2">
                                <input class="form-check-input" type="checkbox" id="gridCheck03">
                                <label class="form-check-label" for="gridCheck03">
                                    雲端 AI 貓語行為與健康情緒分析 +$150 / 月
                                </label>
                            </div>
                        </div>
                        <div class="col-12">
                            <label for="memo" class="form-label">備註說明</label>
                            <textarea class="form-control" id="memo"></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-info btn-lg w-100">選擇方案</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <section class="py-5 container px-5">
        <h2 class="fw-bold text-center mb-4">需要其他協助嗎？</h2>
        <div class="row row-cols-1 row-cols-lg-3 justify-content-center g-4">
            <div class="col-lg-3">
                <div class="card border-0 shadow">
                    <div class="card-body text-center">
                        <button class="btn stretched-link fs-5"><i class="bi bi-telephone-fill text-info me-2"></i>07-555-666</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="card border-0 shadow">
                    <div class="card-body text-center">
                        <button class="btn stretched-link fs-5"><i class="bi bi-facebook text-info me-1"></i>喵星智能科技</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="card border-0 shadow">
                    <div class="card-body text-center">
                        <button class="btn stretched-link fs-5"><i class="bi bi-question-lg text-info me-1"></i>常見問題</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
